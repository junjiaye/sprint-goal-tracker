<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冲刺目标跟踪系统 · 2026 Q4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============ Design Tokens ============ */
:root{
  --red:#D9342B; --red-deep:#B0241C; --red-ink:#8C1D16; --red-soft:#FBEFED; --red-line:#F0CFCB;
  --ink:#211C19; --ink-2:#5C544D; --muted:#8E847B;
  --paper:#F6F3EF; --card:#FFFFFF; --line:#E7E0D8; --line-2:#D8CFC2;
  --amber:#B97F16; --amber-soft:#FBF3E2; --amber-line:#EAD9B4;
  --ok:#2E7D4F; --ok-soft:#E9F3EC;
  --side:#201B18; --side-txt:#B9AFA5;
  --radius:12px; --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(32,22,17,.05), 0 10px 28px -14px rgba(32,22,17,.22);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"PingFang SC",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
::placeholder{color:#B9AFA5}
.ic{width:18px;height:18px;flex:none;vertical-align:-3.5px}

/* ============ App Shell ============ */
#app{display:grid;grid-template-columns:228px 1fr;height:100vh;overflow:hidden}
.side{background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.side-logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#E2483D,#B0241C);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.side-logo .mark .ic{width:19px;height:19px}
.side-logo b{color:#fff;font-size:14.5px;display:block;line-height:1.3;letter-spacing:.5px}
.side-logo i{font-style:normal;font-size:10px;letter-spacing:1.5px;color:#7A6F64;display:block}
.nav-group{padding:10px 12px 2px}
.nav-group>i{display:block;font-style:normal;font-size:10.5px;letter-spacing:2px;color:#6E645A;padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;color:var(--side-txt);font-size:13.5px;text-align:left;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#EDE7E0}
.nav-item.active{background:rgba(217,52,43,.18);color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--red)}
.nav-item .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.nav-item.locked{opacity:.38;cursor:not-allowed}
.side-fill{flex:1;min-height:18px}
.side-persona{border-top:1px solid rgba(255,255,255,.08);padding:14px 14px 16px}
.side-persona>i{font-style:normal;display:block;font-size:10.5px;letter-spacing:2px;color:#6E645A;margin-bottom:9px}
.persona{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:9px;color:var(--side-txt);font-size:13px;text-align:left;transition:background .15s,color .15s}
.persona:hover{background:rgba(255,255,255,.06);color:#EDE7E0}
.persona.on{background:rgba(255,255,255,.1);color:#fff}
.persona .pv{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.persona.on .pv{background:var(--red)}
.persona small{display:block;font-size:10.5px;color:#7A6F64;line-height:1.2}
.persona.on small{color:#C9BFB4}
.side-tools{display:flex;gap:8px;padding:0 14px 16px}
.side-tools button{flex:1;font-size:11.5px;color:#7A6F64;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:5px 0;transition:color .15s,border-color .15s}
.side-tools button:hover{color:#EDE7E0;border-color:rgba(255,255,255,.3)}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:58px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px}
.topbar h1{font-size:16.5px;font-weight:700;letter-spacing:.3px}
.topbar .crumb{font-size:12px;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px 11px;white-space:nowrap}
.chip.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red-deep);font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.me{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.me .mv{width:27px;height:27px;border-radius:50%;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.me b{font-size:13px;display:block;line-height:1.25}
.me small{font-size:10.5px;color:var(--muted);display:block;line-height:1.25}
.content{flex:1;overflow-y:auto;padding:26px 30px 60px}
.view{display:none;max-width:1280px;margin:0 auto}
.view.on{display:block;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ Common ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(32,22,17,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;border-radius:9px;padding:9px 18px;background:var(--ink);color:#fff;transition:transform .12s,opacity .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.red{background:var(--red)}
.btn.red:hover{background:#C42D24}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--muted);color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 10px;font-size:12px;border-radius:7px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn.danger{background:transparent;color:var(--red-deep);border:1px solid var(--red-line)}
.btn.danger:hover{background:var(--red-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.draft{color:var(--muted);border:1px solid var(--line-2);background:var(--paper)}
.pill.submitted{color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line)}
.pill.confirmed{color:#fff;background:var(--red-deep)}
.pill.ok{color:var(--ok);background:var(--ok-soft);border:1px solid #CBE4D3}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.sec-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:12px}
.sec-label::before{content:'';width:8px;height:8px;border-radius:2.5px;background:var(--red)}
.sec-label small{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:1.5px}
.field{margin-bottom:15px}
.field>label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field>label em{font-style:normal;color:var(--red);margin-left:2px}
.ipt{width:100%;border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8.5px 12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.ipt:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,52,43,.1);outline:none}
.ipt:disabled{background:var(--paper);color:var(--muted);cursor:not-allowed}
textarea.ipt{resize:vertical;line-height:1.7}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:18px;border:1px solid}
.banner .ic{margin-top:2px}
.banner.amber{background:var(--amber-soft);border-color:var(--amber-line);color:#7A5510}
.banner.ink{background:#EFEBE6;border-color:var(--line-2);color:var(--ink-2)}
.banner.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red-ink)}

/* ============ 冲刺卡视图 ============ */
.card-layout{display:grid;grid-template-columns:470px 1fr;gap:26px;align-items:start}
.form-panel{padding:22px 24px}
.seq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seq-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;text-align:left;transition:all .15s;background:var(--card)}
.seq-chip .ic{width:17px;height:17px;color:var(--muted)}
.seq-chip b{display:block;font-size:12.5px;line-height:1.3}
.seq-chip i{font-style:normal;display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.seq-chip:hover{border-color:var(--muted)}
.seq-chip.on{border-color:var(--red);background:var(--red-soft);box-shadow:0 0 0 1px var(--red) inset}
.seq-chip.on .ic,.seq-chip.on b{color:var(--red-deep)}
.path-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.path-row .no{width:24px;height:24px;flex:none;border-radius:7px;background:var(--paper);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.path-row .rm{width:26px;height:26px;flex:none;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s}
.path-row .rm:hover{color:var(--red);background:var(--red-soft)}
.path-row .rm .ic{width:14px;height:14px}
.form-actions{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line-2)}

.timeline{display:flex;align-items:flex-start;margin-bottom:18px}
.tl-step{flex:1;text-align:center;position:relative}
.tl-step .nd{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:12px;font-weight:700;position:relative;z-index:1}
.tl-step.done .nd{border-color:var(--red);background:var(--red);color:#fff}
.tl-step.now .nd{border-color:var(--red);color:var(--red-deep);box-shadow:0 0 0 4px rgba(217,52,43,.12)}
.tl-step b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tl-step.done b,.tl-step.now b{color:var(--ink)}
.tl-step small{display:block;font-size:10.5px;color:var(--muted)}
.tl-step::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.tl-step.done::before{background:var(--red)}
.tl-step:first-child::before{display:none}

.preview-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;position:sticky;top:0}
.preview-tip{font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.export-row{display:flex;gap:10px}

/* ============ 冲刺卡（实体卡片） ============ */
.scard{width:460px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;box-shadow:var(--shadow-card);font-size:14px}
.sc-head{position:relative;color:#fff;padding:18px 22px 20px;background:linear-gradient(135deg,#DE3A2F 0%,#B7261C 78%);overflow:hidden}
.sc-head::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 10px,transparent 10px 20px);pointer-events:none}
.sc-head-top{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:1.5px;opacity:.82;margin-bottom:10px;position:relative;z-index:1}
.sc-head-main{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
.sc-title{font-size:29px;font-weight:900;letter-spacing:3px;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.14)}
.sc-eng{font-size:10px;letter-spacing:5px;opacity:.75;margin-top:2px}
.sc-seq{display:inline-flex;align-items:center;gap:6px;margin-top:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(2px);border-radius:99px;padding:3.5px 12px;font-size:12px;font-weight:600}
.sc-seq .ic{width:14px;height:14px}
.sc-seq i{font-style:normal;font-weight:400;opacity:.8;font-size:11px}
.sc-bigq{font-size:62px;font-weight:900;line-height:.9;color:transparent;-webkit-text-stroke:1.6px rgba(255,255,255,.8);letter-spacing:-3px;font-style:italic}
.sc-body{padding:20px 22px 18px}
.sc-id{display:flex;align-items:center;gap:13px;padding-bottom:16px;border-bottom:1px dashed var(--line-2)}
.sc-avatar{width:47px;height:47px;flex:none;border-radius:50%;background:var(--red-soft);border:1.5px solid var(--red-line);color:var(--red-deep);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sc-id-main{flex:1;min-width:0}
.sc-name{font-size:21px;font-weight:800;letter-spacing:1px;line-height:1.25}
.sc-name .sc-code{font-size:11px;font-family:var(--mono);color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.5px}
.sc-dept{font-size:12px;color:var(--ink-2);margin-top:1px}
.sc-ok-tag{flex:none;align-self:flex-start;font-size:10.5px;font-weight:700;color:var(--red-deep);border:1px solid var(--red);border-radius:6px;padding:2px 8px;letter-spacing:2px;transform:rotate(3deg)}
.sc-sec{margin-top:16px}
.sc-sec-label{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.sc-sec-label::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--red);align-self:center}
.sc-sec-label b{font-size:13.5px;font-weight:800;letter-spacing:1px}
.sc-sec-label span{font-size:9.5px;letter-spacing:3px;color:var(--muted)}
.sc-goal{display:flex;gap:10px;padding:7px 0}
.sc-goal .gno{font-size:17px;font-weight:900;color:var(--red);font-style:italic;line-height:1.35;flex:none;width:26px}
.sc-goal p{font-size:13.5px;font-weight:600;line-height:1.55;color:var(--ink)}
.sc-goal p em{font-style:normal;color:var(--red-deep)}
.sc-path{position:relative;margin-left:3px}
.sc-path::before{content:'';position:absolute;left:4.5px;top:8px;bottom:8px;width:1.5px;background:var(--line-2)}
.sc-step{display:flex;gap:11px;padding:4.5px 0;position:relative}
.sc-step .pd{width:10px;height:10px;flex:none;border-radius:50%;background:var(--red);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--red);margin-top:5px}
.sc-step p{font-size:12.5px;color:var(--ink-2);line-height:1.55;font-weight:500}
.sc-sign{display:flex;margin-top:18px;border-top:1px dashed var(--line-2);padding-top:13px;gap:14px}
.sc-sign-cell{flex:1}
.sc-sign-cell span{display:block;font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-bottom:3px}
.sc-sign-cell b{display:block;font-size:14.5px;font-weight:700;letter-spacing:2px}
.sc-sign-cell b.pending{color:var(--amber);font-size:12px;font-weight:600;letter-spacing:.5px}
.sc-sign-cell i{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:12px;border-top:1px solid var(--line)}
.sc-foot span{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);font-family:var(--mono)}
.sc-bar{width:118px;height:22px;background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 4px,var(--ink) 4px 5.5px,transparent 5.5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.75}
.sc-seal{position:absolute;right:26px;top:56.5%;width:112px;height:112px;color:#C4271E;opacity:.94;transform:rotate(-13deg);pointer-events:none;mix-blend-mode:multiply}
.scard.is-locked .sc-seal{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-13deg) scale(1.9);opacity:0}60%{opacity:.94}100%{transform:rotate(-13deg) scale(1)}}
.scard.empty-state{border-style:dashed;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);min-height:560px;background:transparent}
.scard.empty-state .ic{width:34px;height:34px;opacity:.5}

/* ============ 看板视图 ============ */
.dept-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dtab{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);transition:all .15s}
.dtab:hover{border-color:var(--muted)}
.dtab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.dtab.lock{opacity:.45;cursor:default}
.dtab .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.board-head{padding:20px 24px;display:flex;gap:22px;align-items:center;margin-bottom:16px}
.board-head .bh-main{flex:1;min-width:0}
.board-head h2{font-size:20px;font-weight:800;letter-spacing:.5px}
.board-head .bh-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.board-head .bh-sub b{color:var(--ink)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rc{fill:none;stroke:var(--line);stroke-width:8}
.ring .rv{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rt b{font-size:20px;font-weight:800;line-height:1}
.ring .rt small{font-size:9.5px;color:var(--muted);letter-spacing:1px}
.path-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.path-chip{font-size:11.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.path-chip .ic{width:12px;height:12px;color:var(--red)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.goal-card{padding:18px 20px}
.goal-card .gc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.goal-card .gc-tag{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--red-deep);background:var(--red-soft);border-radius:5px;padding:2px 8px;flex:none}
.goal-card h3{font-size:14px;font-weight:700;line-height:1.5}
.goal-card .gc-num{display:flex;align-items:baseline;gap:9px;margin:6px 0 10px}
.goal-card .gc-num b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.goal-card .gc-num .delta{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.delta.up{color:var(--ok);background:var(--ok-soft)}
.delta.flat{color:var(--muted);background:var(--paper)}
.gc-bar{height:9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.gc-bar .fill{position:absolute;inset:0;width:0;border-radius:99px;background:linear-gradient(90deg,#E2483D,var(--red-deep));transition:width .6s ease}
.gc-bar .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.gc-note{margin-top:10px;font-size:12px;color:var(--ink-2);background:var(--paper);border-radius:8px;padding:8px 11px;line-height:1.6}
.gc-note b{color:var(--ink);font-weight:600}
.gc-spark{margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between}
.gc-spark small{font-size:10.5px;color:var(--muted)}
.week-rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.wr-label{font-size:11.5px;color:var(--muted);margin-right:6px;letter-spacing:1px}
.wk{width:42px;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);transition:all .15s;position:relative;line-height:1.2}
.wk b{font-weight:700;font-size:12px}
.wk:hover{border-color:var(--muted)}
.wk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wk.has::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.wk.on.has::after{background:#fff}
.wk.cur::before{content:'本周';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--red-deep);font-weight:700;letter-spacing:1px}
.wk:disabled{opacity:.32;cursor:not-allowed}
.week-panel{padding:20px 24px}
.wp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wp-head h3{font-size:15px;font-weight:800}
.wp-head small{color:var(--muted);font-size:11.5px;margin-left:9px;font-weight:400}
.wp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wp-goal{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.wp-goal .wpg-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wp-goal .wpg-top b{font-size:12.5px;line-height:1.45}
.wp-goal .wpg-top span{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red-deep)}
.wp-goal p{font-size:11.5px;color:var(--muted)}
.wp-note{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:12px;font-size:13px;color:var(--ink-2);line-height:1.7}
.wp-meta{margin-top:8px;font-size:11px;color:var(--muted)}
.editor{border:2px solid var(--red);border-radius:var(--radius);padding:18px 20px;background:#FFFDFC}
.editor h4{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.editor h4 .ic{color:var(--red)}
.slider-row{display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:center;margin-bottom:12px}
.slider-row .sr-name{font-size:12.5px;font-weight:600;line-height:1.4}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:99px;background:var(--line-2);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 1px 5px rgba(178,36,28,.5);cursor:grab}
.sr-val{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.sr-val input{width:52px;border:1px solid var(--line-2);border-radius:7px;padding:4px 6px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sr-val span{font-size:12px;color:var(--muted)}
.editor-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}

/* ============ 审核台 ============ */
.sum-chips{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sum-chip{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px}
.sum-chip b{font-size:22px;font-weight:800;line-height:1}
.sum-chip span{font-size:12px;color:var(--ink-2)}
.sum-chip i{width:9px;height:9px;border-radius:3px;font-style:normal}
.rev-list{display:flex;flex-direction:column;gap:10px}
.rev-row{display:flex;align-items:center;gap:15px;padding:15px 20px}
.rev-row .rv2{width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink-2);flex:none}
.rev-row .rmain{flex:1;min-width:0}
.rev-row .rmain b{font-size:14.5px}
.rev-row .rmain .rmeta{font-size:11.5px;color:var(--muted);display:flex;gap:12px;margin-top:2px;flex-wrap:wrap}
.rev-row .rmeta .mono{font-family:var(--mono);letter-spacing:.5px}
.rev-actions{display:flex;gap:8px;flex:none}
.goal-peek{font-size:12px;color:var(--ink-2);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.goal-peek::before{content:'目标 · ';color:var(--red-deep);font-weight:600;font-size:11px}

/* ============ BP总览 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 20px}
.stat .st-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat .st-label .ic{width:14px;height:14px;color:var(--red)}
.stat .st-num{font-size:30px;font-weight:800;line-height:1.2;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .st-num small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.stat .st-sub{font-size:11px;color:var(--muted)}
.mini-bar{height:7px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin-top:9px}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,#E2483D,var(--red-deep));border-radius:99px}
table.bp{width:100%;border-collapse:collapse}
table.bp th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);letter-spacing:.5px;white-space:nowrap}
table.bp td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.bp tr:last-child td{border-bottom:none}
table.bp tr:hover td{background:#FBFAF8}
td .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pb-cell{display:flex;align-items:center;gap:10px;min-width:150px}
.pb-cell .mini-bar{flex:1;margin:0}
.pb-cell span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}

/* ============ Modal / Toast ============ */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(26,19,15,.5);backdrop-filter:blur(3px);z-index:100;padding:24px}
#modal-root.on{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 24px 70px -20px rgba(26,19,15,.5);animation:min .22s ease}
@keyframes min{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-pad{padding:24px 26px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal-head h3{font-size:15.5px;font-weight:800}
.modal-head .x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-head .x:hover{background:var(--paper);color:var(--ink)}
.modal-card-zone{display:flex;justify-content:center;padding:22px;background:linear-gradient(180deg,#F1EDE7,#F6F3EF)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line)}
.matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix th,.matrix td{border:1px solid var(--line);padding:9px 12px;text-align:center}
.matrix th{background:var(--paper);font-size:12px}
.matrix td:first-child{text-align:left;font-weight:600;background:#FBFAF8;white-space:nowrap}
.matrix .y{color:var(--ok);font-weight:700}
.matrix .n{color:#C9BFB4}
.matrix .p{color:var(--amber);font-weight:600;font-size:11.5px}
.guide{counter-reset:g}
.guide li{list-style:none;position:relative;padding:7px 0 7px 34px;font-size:13.5px;color:var(--ink-2);border-bottom:1px dashed var(--line)}
.guide li:last-child{border:none}
.guide li::before{counter-increment:g;content:counter(g,decimal-leading-zero);position:absolute;left:0;top:8px;font-size:12px;font-weight:800;color:var(--red);font-style:italic}
.guide b{color:var(--ink)}
#toast-root{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;font-size:13px;border-radius:99px;padding:9px 20px;box-shadow:0 10px 30px -8px rgba(26,19,15,.5);animation:tin .3s ease}
.toast .ic{width:15px;height:15px;color:#7FD9A3}
.toast.warn .ic{color:#F2C063}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ============ Print ============ */
#printMount{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body.printing #app{display:none!important}
  body.printing #modal-root,body.printing #toast-root{display:none!important}
  body.printing #printMount{display:flex!important;justify-content:center}
  body.printing #printMount .scard{box-shadow:none;border:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1120px){
  #app{grid-template-columns:64px 1fr}
  .side-logo b,.side-logo i,.nav-group>i,.nav-item span,.nav-item .bdg,.side-persona>i,.persona small,.side-tools{display:none}
  .nav-item{justify-content:center;padding:11px 0}
  .persona{justify-content:center;padding:8px 0}
  .card-layout{grid-template-columns:1fr}
  .preview-wrap{position:static}
  .goal-grid,.wp-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}

/* ---------- 持久化 ---------- */
const LSKEY='sprint-proto-v1';
function save(){try{localStorage.setItem(LSKEY,JSON.stringify({cards:DB.cards,depts:DB.depts.map(d=>({id:d.id,head:d.head,goals:d.goals,path:d.path,weeks:d.weeks,hasBoard:d.hasBoard,lastAt:d.lastAt}))}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(LSKEY)||'null');if(!j)return;Object.assign(DB.cards,j.cards||{});(j.depts||[]).forEach(sd=>{const d=DB.depts.find(x=>x.id===sd.id);if(d)Object.assign(d,sd)})}catch(e){}}

/* ---------- 工具 ---------- */
const person=()=>DB.people[S.persona];
const myCard=()=>DB.cards[S.persona];
const goalsOf=c=>String(c.goals||'').split('\n').map(s=>s.trim()).filter(Boolean);
const pathsOf=c=>(c.path||[]).map(s=>s.trim()).filter(Boolean);
const deptOf=id=>DB.depts.find(d=>d.id===id);
const latestPct=(d,w,gi)=>{for(let k=w;k>=1;k--){if(d.weeks[k])return d.weeks[k].pct[gi]??0}return 0};
const hasData=(d,w)=>!!d.weeks[w];
const fmtW=n=>`第 ${n} 周`;
function toast(msg,warn){const t=document.createElement('div');t.className='toast'+(warn?' warn':'');t.innerHTML=`${ic(warn?'bell':'shield')}${esc(msg)}`;$('#toast-root').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},2600)}

/* ---------- 权限 ---------- */
const PERM={
 canEditCard:()=>{const c=myCard();return c.status==='draft'},

function sparkSVG(vals){
  const w=120,h=30,n=Math.max(vals.length,2);
  const pts=vals.map((v,i)=>`${(i/(n-1))*w},${h-2-(v/100)*(h-6)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w}" cy="${h-2-(vals[vals.length-1]/100)*(h-6)}" r="2.6" fill="var(--red)"/></svg>`;
}

/* ============ 主渲染 ============ */
function render(){
  const p=person();
  if(S.route==='review'&&!PERM.canReview())S.route='card';
  if(S.route==='bp'&&!PERM.canBP())S.route='card';
  ['card','board','review','bp'].forEach(r=>{
    const el=$('#view-'+r);el.classList.toggle('on',S.route===r);
  });
  renderNav();renderPersonas();renderTopbar();
  if(S.route==='card')renderCardView();
  if(S.route==='board')renderBoard();
  if(S.route==='review')renderReview();
  if(S.route==='bp')renderBP();
  const hash={card:'#/card',board:'#/board',review:'#/review',bp:'#/bp'}[S.route];
  if(location.hash!==hash)history.replaceState(null,'',hash);
}

/* ============ Modal ============ */
function openModal(html){$('#modal-root').innerHTML=html;$('#modal-root').classList.add('on')}
function closeModal(){$('#modal-root').classList.remove('on');$('#modal-root').innerHTML=''}

/* ============ 应用动作 ============ */
const App={
  go(r){S.route=r;if(r==='board')S.editWeek=false;render()},
  switchPersona(id){S.persona=id;S.route='card';S.editWeek=false;const p=DB.people[id];S.selDept=p.deptId;S.selWeek=Q.current;render();toast(`已切换为 ${p.name}（${p.roleName}），权限已同步`)},
  pickSeq(id){const c=myCard();if(c.status!=='draft')return;c.seq=id;renderCardView()},
  onFormInput(){
    const c=myCard();if(c.status!=='draft')return;
    c.name=$('#f-name').value.trim();c.code=$('#f-code').value.trim();c.dept=$('#f-dept').value.trim();
    c.goals=$('#f-goals').value;
    c.path=[...document.querySelectorAll('.path-input')].map(i=>i.value);
    $('#card-preview').innerHTML=cardHTML(S.persona,'me');
  },
  addPath(){const c=myCard();c.path.push('');renderCardView();const list=$('#path-list');const inputs=list.querySelectorAll('.path-input');inputs[inputs.length-1].focus()},
  rmPath(i){const c=myCard();if(c.path.length<=1){c.path=['']}else{c.path.splice(i,1)}renderCardView()},
  saveDraft(){App.onFormInput();const c=myCard();c.savedAt='刚刚';save();renderCardView();toast('草稿已保存')},
  submitCard(){
    App.onFormInput();const c=myCard();
    if(!c.name||!c.code||!c.dept){toast('请填写姓名、员工编码与部门',1);return}
    if(!goalsOf(c).length){toast('请至少填写一个冲刺目标',1);return}
    if(!pathsOf(c).length){toast('请至少填写一条实施路径',1);return}
    openModal(`<div class="modal" style="max-width:430px"><div class="modal-pad">
      <h3 style="font-size:16px;margin-bottom:10px">提交部门负责人确认</h3>
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.8">提交后目标卡进入<b>「一对一确认」</b>环节，请与部门负责人（${esc(deptOf('impl').head)}）当面确认目标与路径。<br>确认通过前仍可退回修改。</p>
      <div class="modal-actions" style="padding:16px 0 0;border:none">
        <button class="btn ghost sm" onclick="App.closeModal()">再想想</button>
        <button class="btn red sm" onclick="App.doSubmit()">${ic('send')} 确认提交</button>
      </div></div></div>`);
  },
  doSubmit(){const c=myCard();c.status='submitted';c.submittedAt='刚刚';c.savedAt='刚刚';save();closeModal();renderCardView();renderNav();toast('已提交，等待部门负责人一对一确认')},
  exportPNG(uid){
    const el=document.getElementById('scard-'+uid);
    if(!el){toast('暂无可导出的目标卡',1);return}
    if(typeof html2canvas==='undefined'){toast('导出组件未加载（离线），已为你打开打印',1);App.printCard(uid);return}
    html2canvas(el,{scale:2,useCORS:true,backgroundColor:null}).then(cv=>{
      const a=document.createElement('a');const name=(myCard().name||'成员');
      a.download=`冲刺目标卡-${name}-2026Q4.png`;a.href=cv.toDataURL('image/png');a.click();toast('目标卡图片已导出');
    }).catch(()=>{toast('导出失败，已为你打开打印',1);App.printCard(uid)});
  },
  printCard(uid){
    const el=document.getElementById('scard-'+uid);if(!el){toast('暂无可打印的目标卡',1);return}
    const m=$('#printMount');m.innerHTML='';m.appendChild(el.cloneNode(true));
    document.body.classList.add('printing');
    const done=()=>{document.body.classList.remove('printing');m.innerHTML='';window.removeEventListener('afterprint',done)};
    window.addEventListener('afterprint',done);
    setTimeout(()=>window.print(),60);
  },
  /* ---- 看板 ---- */
  pickDept(id){if(!PERM.canSwitchDept(deptOf(id))){toast('员工仅可查看本部门看板',1);return}S.selDept=id;S.editWeek=false;render()},
  pickWeek(n){S.selWeek=n;S.editWeek=false;render()},
  startWeekEdit(){S.editWeek=true;render()},
  cancelWeekEdit(){S.editWeek=false;render()},
  saveWeek(){
    const d=deptOf(S.selDept);const pcts=d.goals.map((_,gi)=>Math.max(0,Math.min(100,+($('#nrg-'+gi)?.value||latestPct(d,S.selWeek,gi)))));
    const note=$('#wk-note').value.trim();
    if(!note){toast('请填写本周进展说明',1);return}
    d.weeks[S.selWeek]={pct:pcts,note,at:'刚刚',by:person().name};

  },
  editDept(){
    const d=deptOf(S.selDept);
    openModal(`<div class="modal" style="max-width:520px"><div class="modal-head"><h3>部门目标设置 · ${esc(d.name)}</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>

      </div></div>`);
  },

      <table class="matrix">
        <tr><th style="text-align:left">功能</th><th>员工</th><th>部门负责人</th><th>BP / 人力</th></tr>
        <tr><td>填写个人冲刺卡</td><td class="y">✓ 本人（确认前）</td><td class="y">✓ 本人（确认前）</td><td class="y">✓ 本人（确认前）</td></tr>
        <tr><td>审核 · 锁定成员目标卡</td><td class="n">—</td><td class="y">✓ 本部门</td><td class="n">—</td></tr>
        <tr><td>查看部门进度看板</td><td class="p">仅本部门 · 只读</td><td class="y">✓ 本部门 · 可编辑</td><td class="y">✓ 全部 · 只读</td></tr>
        <tr><td>填写部门目标（部门/负责人/目标1/目标2/路径）</td><td class="n">—</td><td class="y">✓</td><td class="n">—</td></tr>
        <tr><td>每周更新部门进度</td><td class="n">—</td><td class="y">✓</td><td class="n">—</td></tr>
        <tr><td>全公司统计与提醒</td><td class="n">—</td><td class="n">—</td><td class="y">✓</td></tr>
        <tr><td>目标卡导出（PNG / 打印）</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td></tr>
      </table>
      <p class="hint" style="margin-top:12px">锁定规则：部门负责人审核确认后，员工与负责人双方均不可修改；退回后员工可重新填写再提交。</p>
    </div></div>`);
  },
  openGuide(){
    openModal(`<div class="modal" style="max-width:520px"><div class="modal-head"><h3>原型演示指引</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
    <div class="modal-pad"><ol class="guide">
      <li><b>左下角切换演示身份</b>：员工 张明 / 部门负责人 李强 / BP 王芳，左侧菜单与操作权限随之变化。</li>
      <li><b>员工</b>：在「我的冲刺卡」选择序列、填写目标与路径 → 点击「提交负责人确认」。</li>
      <li><b>负责人</b>：切到「团队审核」查看成员目标卡 → 与成员一对一确认后「确认锁定」，锁定后双方不可修改（卡片盖章）。</li>
      <li><b>负责人</b>：在「部门进度看板」设置部门目标（部门 / 负责人 / 目标1 / 目标2 / 路径），并<b>每周更新进度</b>。</li>
      <li><b>员工</b>：看板为只读，且只能看到本部门进度。</li>
      <li><b>BP</b>：「BP 总览」查看全公司确认率、看板更新情况并发送提醒。</li>
      <li><b>导出</b>：冲刺卡支持导出 PNG 图片与打印 / PDF。</li>
    </ol></div></div>`);
  },
  reset(){localStorage.removeItem(LSKEY);location.href=location.pathname+'#/card';location.reload()},
  closeModal,
};

/* ============ 启动 ============ */
$('#logo-mark').innerHTML=ic('flag');
load();
(function(){
  const h=location.hash.replace('#/','');
  if(['card','board','review','bp'].includes(h))S.route=h;
  const q=new URLSearchParams(location.search).get('p');
  if(q&&DB.people[q])S.persona=q;
  const p=person();S.selDept=p.deptId;
  render();
  setTimeout(()=>toast('原型已就绪：左下角可切换 员工 / 负责人 / BP 三种身份体验权限'),600);
})();
</script>
</body>
</html>
