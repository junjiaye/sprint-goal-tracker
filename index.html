<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冲刺目标跟踪系统 · 2026 Q4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============ Design Tokens（官方红 #E60012） ============ */
:root{
  --red:#E60012; --red-deep:#A8000B; --red-soft:#FCEBEB; --red-line:#F2C9CC; --red-paper:#FDF2F3;
  --ink:#211C19; --ink-2:#5C544D; --muted:#8E847B;
  --paper:#F6F3EF; --card:#FFFFFF; --line:#E7E0D8; --line-2:#D8CFC2; --info-bg:#F4F6FA;
  --amber:#B97F16; --amber-soft:#FBF3E2; --amber-line:#EAD9B4;
  --ok:#2E7D4F; --ok-soft:#E9F3EC;
  --side:#201B18; --side-txt:#B9AFA5;
  --radius:12px; --radius-sm:8px;
  --shadow-card:0 1px 2px rgba(32,22,17,.05), 0 10px 28px -14px rgba(32,22,17,.22);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"PingFang SC",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
::placeholder{color:#B9AFA5}
.ic{width:18px;height:18px;flex:none;vertical-align:-3.5px}

/* ============ App Shell ============ */
#app{display:grid;grid-template-columns:228px 1fr;height:100vh;overflow:hidden}
.side{background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.side-logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#F01A26,#A8000B);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.side-logo .mark .ic{width:19px;height:19px}
.side-logo b{color:#fff;font-size:14.5px;display:block;line-height:1.3;letter-spacing:.5px}
.side-logo i{font-style:normal;font-size:10px;letter-spacing:1.5px;color:#7A6F64;display:block}
.nav-group{padding:10px 12px 2px}
.nav-group>i{display:block;font-style:normal;font-size:10.5px;letter-spacing:2px;color:#6E645A;padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;color:var(--side-txt);font-size:13.5px;text-align:left;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#EDE7E0}
.nav-item.active{background:rgba(230,0,18,.2);color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--red)}
.nav-item .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.side-fill{flex:1;min-height:18px}
.side-user{border-top:1px solid rgba(255,255,255,.08);padding:14px 14px 16px}
.side-user>i{font-style:normal;display:block;font-size:10.5px;letter-spacing:2px;color:#6E645A;margin-bottom:9px}
.cur-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px 11px;margin-bottom:9px}
.cur-user .pv{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.cur-user b{color:#fff;font-size:13.5px;display:block;line-height:1.3}
.cur-user small{display:block;font-size:10.5px;color:#C9BFB4;line-height:1.35}
.cur-user .role{font-size:10px;color:#F2C063;border:1px solid rgba(242,192,99,.4);border-radius:5px;padding:0 5px;margin-left:5px;white-space:nowrap}
.btn-switch{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:#EDE7E0;background:rgba(230,0,18,.85);border-radius:9px;padding:8px 0;transition:background .15s}
.btn-switch:hover{background:var(--red)}
.side-tools{display:flex;gap:8px;padding:0 14px 16px}
.side-tools button{flex:1;font-size:11.5px;color:#7A6F64;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:5px 0;transition:color .15s,border-color .15s}
.side-tools button:hover{color:#EDE7E0;border-color:rgba(255,255,255,.3)}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:58px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px}
.topbar h1{font-size:16.5px;font-weight:700;letter-spacing:.3px}
.topbar .crumb{font-size:12px;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px 11px;white-space:nowrap}
.chip.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red-deep);font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.content{flex:1;overflow-y:auto;padding:26px 30px 60px}
.view{display:none;max-width:1280px;margin:0 auto}
.view.on{display:block;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ Common ============ */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(32,22,17,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;border-radius:9px;padding:9px 18px;background:var(--ink);color:#fff;transition:transform .12s,opacity .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.red{background:var(--red)}
.btn.red:hover{background:#C70010}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--muted);color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 10px;font-size:12px;border-radius:7px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn.danger{background:transparent;color:var(--red-deep);border:1px solid var(--red-line)}
.btn.danger:hover{background:var(--red-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.draft{color:var(--muted);border:1px solid var(--line-2);background:var(--paper)}
.pill.submitted{color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line)}
.pill.confirmed{color:#fff;background:var(--red-deep)}
.pill.ok{color:var(--ok);background:var(--ok-soft);border:1px solid #CBE4D3}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.sec-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:12px}
.sec-label::before{content:'';width:8px;height:8px;border-radius:2.5px;background:var(--red)}
.sec-label small{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:1.5px}
.field{margin-bottom:15px}
.field>label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field>label em{font-style:normal;color:var(--red);margin-left:2px}
.ipt{width:100%;border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8.5px 12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.ipt:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,0,18,.09);outline:none}
.ipt:disabled{background:var(--paper);color:var(--muted);cursor:not-allowed}
textarea.ipt{resize:vertical;line-height:1.7}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:18px;border:1px solid}
.banner .ic{margin-top:2px}
.banner.amber{background:var(--amber-soft);border-color:var(--amber-line);color:#7A5510}
.banner.ink{background:#EFEBE6;border-color:var(--line-2);color:var(--ink-2)}
.banner.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red-deep)}

/* ============ 表单区 ============ */
.card-layout{display:grid;grid-template-columns:470px 1fr;gap:26px;align-items:start}
.form-panel{padding:22px 24px}
.seq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seq-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;text-align:left;transition:all .15s;background:var(--card)}
.seq-chip .ic{width:17px;height:17px;color:var(--muted)}
.seq-chip b{display:block;font-size:12.5px;line-height:1.3}
.seq-chip i{font-style:normal;display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.seq-chip:hover{border-color:var(--muted)}
.seq-chip.on{border-color:var(--red);background:var(--red-soft);box-shadow:0 0 0 1px var(--red) inset}
.seq-chip.on .ic,.seq-chip.on b{color:var(--red-deep)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--info-bg);border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin-bottom:15px}
.info-grid .ig{padding:8px 13px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.info-grid .ig:nth-child(2n){border-right:none}
.info-grid .ig:nth-last-child(-n+2){border-bottom:none}
.info-grid .ig span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:2px}
.info-grid .ig b{font-size:12.5px}
.item-row{display:grid;grid-template-columns:30px 1fr 118px;gap:10px;align-items:center;margin-bottom:9px}
.item-row .no{width:26px;height:26px;border-radius:8px;background:var(--red-soft);border:1px solid var(--red-line);color:var(--red-deep);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-style:italic}
.item-row .it-name{font-size:13px;font-weight:600;line-height:1.45}
.item-row .it-name small{font-weight:400;color:var(--muted)}
.item-row input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
.item-row input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,0,18,.09);outline:none}
.item-row .uwrap{position:relative}
.item-row .uwrap span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.item-row .uwrap input{padding-right:44px}
.fill-guide{margin-top:16px;border:1px dashed var(--line-2);border-radius:9px;padding:11px 14px;font-size:11.5px;color:var(--ink-2);line-height:1.8;background:#FBFAF8}
.fill-guide b{color:var(--ink)}
.form-actions{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line-2)}
.timeline{display:flex;align-items:flex-start;margin-bottom:18px}
.tl-step{flex:1;text-align:center;position:relative}
.tl-step .nd{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:12px;font-weight:700;position:relative;z-index:1}
.tl-step.done .nd{border-color:var(--red);background:var(--red);color:#fff}
.tl-step.now .nd{border-color:var(--red);color:var(--red-deep);box-shadow:0 0 0 4px rgba(230,0,18,.1)}
.tl-step b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tl-step.done b,.tl-step.now b{color:var(--ink)}
.tl-step small{display:block;font-size:10.5px;color:var(--muted)}
.tl-step::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.tl-step.done::before{background:var(--red)}
.tl-step:first-child::before{display:none}
.preview-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;position:sticky;top:0}
.preview-tip{font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.export-row{display:flex;gap:10px}

/* ============ 达标冲刺目标卡（实体卡片，官方 Word 版式） ============ */
.scard{width:460px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;box-shadow:var(--shadow-card);font-size:14px}
.sc-redhead{background:linear-gradient(160deg,#EE0718 0%,#E60012 55%,#C40412 100%);padding:14px 18px 15px;position:relative;overflow:hidden}
.sc-redhead::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 10px,transparent 10px 20px);pointer-events:none}
.sc-toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;position:relative;z-index:1}
.sc-logo{height:44px;width:auto;display:block;flex:none}
.sc-topart{font-size:13px;font-weight:800;color:#fff;letter-spacing:1.5px;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.12)}
.sc-dochead{padding:8px 6px 0;text-align:center;position:relative;z-index:1}
.sc-title{font-size:22px;font-weight:900;letter-spacing:4.5px;color:#fff;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,.14)}
.sc-slogan{font-size:11px;color:rgba(255,255,255,.95);letter-spacing:3.5px;font-weight:600;margin-top:4px}
.sc-body{padding:14px 22px 16px}
.sc-tb{width:100%;border-collapse:collapse;table-layout:fixed}
.sc-tb td,.sc-tb th{border:1px solid #D9A9AD;padding:7px 8px;font-size:12.5px;line-height:1.5;vertical-align:middle;word-break:break-all}
.sc-tb .lab{background:var(--info-bg);color:var(--ink-2);font-weight:600;text-align:center;letter-spacing:1px}
.sc-tb .val{font-weight:700;text-align:center;color:var(--ink)}
.sc-tb .val.red{color:var(--red-deep)}
.sc-tb .val.pending{color:var(--amber);font-weight:600}
.sc-sec{margin:13px 0 7px;font-weight:800;color:var(--red);font-size:13.5px;letter-spacing:1.5px;display:flex;align-items:center;gap:7px}
.sc-sec::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--red);flex:none}
.sc-sec small{font-weight:400;color:var(--muted);font-size:10px;letter-spacing:1px;margin-left:auto}
.sc-ghead th{background:var(--red-soft);color:var(--red-deep);font-size:11.5px;font-weight:800;letter-spacing:2px;text-align:center;padding:6.5px 8px}
.sc-gno{width:46px;text-align:center;font-weight:800;color:var(--red);font-size:13px}
.sc-gt{font-size:12.5px;font-weight:600;line-height:1.65;padding:8px 11px}
.sc-gt .gv{color:var(--red-deep);font-weight:800;font-variant-numeric:tabular-nums}
.sc-gt .gv i{font-style:normal;font-size:10.5px;font-weight:600;opacity:.8;margin-left:1px}
.sc-gt .gv.empty{color:#C9BFB4;font-weight:500;letter-spacing:1px;font-size:11px}
.sc-words{margin-top:12px;background:var(--red-paper);border:1px solid var(--red-line);border-radius:3px;padding:9px 13px;font-size:10.8px;color:#96574B;line-height:1.85;text-align:justify}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:9px;border-top:1px solid var(--line)}
.sc-foot span{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);font-family:var(--mono)}
.sc-bar{width:118px;height:20px;background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 4px,var(--ink) 4px 5.5px,transparent 5.5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.7}
.sc-seal{position:absolute;right:30px;bottom:88px;width:108px;height:108px;color:#B80010;opacity:.94;transform:rotate(-13deg);pointer-events:none;mix-blend-mode:multiply}
.scard.is-locked .sc-seal{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-13deg) scale(1.9);opacity:0}60%{opacity:.94}100%{transform:rotate(-13deg) scale(1)}}
.scard.empty-state{border-style:dashed;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);min-height:560px;background:transparent}
.scard.empty-state .ic{width:34px;height:34px;opacity:.5}

/* ============ 看板视图 ============ */
.dept-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dtab{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);transition:all .15s}
.dtab:hover{border-color:var(--muted)}
.dtab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.dtab .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.board-head{padding:20px 24px;display:flex;gap:22px;align-items:center;margin-bottom:16px}
.board-head .bh-main{flex:1;min-width:0}
.board-head h2{font-size:20px;font-weight:800;letter-spacing:.5px}
.board-head .bh-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.board-head .bh-sub b{color:var(--ink)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rc{fill:none;stroke:var(--line);stroke-width:8}
.ring .rv{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rt b{font-size:20px;font-weight:800;line-height:1}
.ring .rt small{font-size:9.5px;color:var(--muted);letter-spacing:1px}
.path-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.path-chip{font-size:11.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.path-chip .ic{width:12px;height:12px;color:var(--red)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.goal-card{padding:18px 20px}
.goal-card .gc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.goal-card .gc-tag{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--red-deep);background:var(--red-soft);border-radius:5px;padding:2px 8px;flex:none}
.goal-card h3{font-size:14px;font-weight:700;line-height:1.5}
.goal-card .gc-num{display:flex;align-items:baseline;gap:9px;margin:6px 0 10px}
.goal-card .gc-num b{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.goal-card .gc-num .delta{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.delta.up{color:var(--ok);background:var(--ok-soft)}
.delta.flat{color:var(--muted);background:var(--paper)}
.gc-bar{height:9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.gc-bar .fill{position:absolute;inset:0;width:0;border-radius:99px;background:linear-gradient(90deg,#F0101C,var(--red-deep));transition:width .6s ease}
.gc-bar .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.gc-note{margin-top:10px;font-size:12px;color:var(--ink-2);background:var(--paper);border-radius:8px;padding:8px 11px;line-height:1.6}
.gc-note b{color:var(--ink);font-weight:600}
.gc-spark{margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between}
.gc-spark small{font-size:10.5px;color:var(--muted)}
.week-rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.wr-label{font-size:11.5px;color:var(--muted);margin-right:6px;letter-spacing:1px}
.wk{width:42px;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);transition:all .15s;position:relative;line-height:1.2}
.wk b{font-weight:700;font-size:12px}
.wk:hover{border-color:var(--muted)}
.wk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wk.has::after{content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.wk.on.has::after{background:#fff}
.wk.cur::before{content:'本周';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--red-deep);font-weight:700;letter-spacing:1px}
.wk:disabled{opacity:.32;cursor:not-allowed}
.week-panel{padding:20px 24px}
.wp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wp-head h3{font-size:15px;font-weight:800}
.wp-head small{color:var(--muted);font-size:11.5px;margin-left:9px;font-weight:400}
.wp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wp-goal{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.wp-goal .wpg-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wp-goal .wpg-top b{font-size:12.5px;line-height:1.45}
.wp-goal .wpg-top span{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red-deep)}
.wp-goal p{font-size:11.5px;color:var(--muted)}
.wp-note{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:12px;font-size:13px;color:var(--ink-2);line-height:1.7}
.wp-meta{margin-top:8px;font-size:11px;color:var(--muted)}
.editor{border:2px solid var(--red);border-radius:var(--radius);padding:18px 20px;background:#FFFDFC}
.editor h4{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.editor h4 .ic{color:var(--red)}
.slider-row{display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:center;margin-bottom:12px}
.slider-row .sr-name{font-size:12.5px;font-weight:600;line-height:1.4}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:99px;background:var(--line-2);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 1px 5px rgba(168,0,11,.5);cursor:grab}
.sr-val{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.sr-val input{width:52px;border:1px solid var(--line-2);border-radius:7px;padding:4px 6px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sr-val span{font-size:12px;color:var(--muted)}
.editor-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}

/* ============ 团队目标卡 ============ */
.sum-chips{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sum-chip{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px}
.sum-chip b{font-size:22px;font-weight:800;line-height:1}
.sum-chip span{font-size:12px;color:var(--ink-2)}
.sum-chip i{width:9px;height:9px;border-radius:3px;font-style:normal}
.rev-list{display:flex;flex-direction:column;gap:10px}
.rev-row{display:flex;align-items:center;gap:15px;padding:15px 20px}
.rev-row .rv2{width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink-2);flex:none}
.rev-row .rmain{flex:1;min-width:0}
.rev-row .rmain b{font-size:14.5px}
.rev-row .rmain .rmeta{font-size:11.5px;color:var(--muted);display:flex;gap:12px;margin-top:2px;flex-wrap:wrap}
.rev-row .rmeta .mono{font-family:var(--mono);letter-spacing:.5px}
.rev-actions{display:flex;gap:8px;flex:none}
.goal-peek{font-size:12px;color:var(--ink-2);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.goal-peek::before{content:'目标 · ';color:var(--red-deep);font-weight:600;font-size:11px}

/* ============ BP总览 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 20px}
.stat .st-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat .st-label .ic{width:14px;height:14px;color:var(--red)}
.stat .st-num{font-size:30px;font-weight:800;line-height:1.2;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .st-num small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.stat .st-sub{font-size:11px;color:var(--muted)}
.mini-bar{height:7px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin-top:9px}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,#F0101C,var(--red-deep));border-radius:99px}
table.bp{width:100%;border-collapse:collapse}
table.bp th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);letter-spacing:.5px;white-space:nowrap}
table.bp td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.bp tr:last-child td{border-bottom:none}
table.bp tr:hover td{background:#FBFAF8}
.pb-cell{display:flex;align-items:center;gap:10px;min-width:150px}
.pb-cell .mini-bar{flex:1;margin:0}
.pb-cell span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}

/* ============ Modal / Toast ============ */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(26,19,15,.5);backdrop-filter:blur(3px);z-index:100;padding:24px}
#modal-root.on{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 24px 70px -20px rgba(26,19,15,.5);animation:min .22s ease}
@keyframes min{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-pad{padding:24px 26px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal-head h3{font-size:15.5px;font-weight:800}
.modal-head .x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-head .x:hover{background:var(--paper);color:var(--ink)}
.modal-card-zone{display:flex;justify-content:center;padding:22px;background:linear-gradient(180deg,#F1EDE7,#F6F3EF)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line)}
.matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix th,.matrix td{border:1px solid var(--line);padding:9px 12px;text-align:center}
.matrix th{background:var(--paper);font-size:12px}
.matrix td:first-child{text-align:left;font-weight:600;background:#FBFAF8;white-space:nowrap}
.matrix .y{color:var(--ok);font-weight:700}
.matrix .n{color:#C9BFB4}
.matrix .p{color:var(--amber);font-weight:600;font-size:11.5px}
.cmp-table{width:100%;border-collapse:collapse;font-size:12px}
.cmp-table th,.cmp-table td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;line-height:1.7}
.cmp-table th{background:var(--red-soft);color:var(--red-deep);font-size:11.5px;letter-spacing:1px;white-space:nowrap}
.cmp-table td:first-child{font-weight:700;white-space:nowrap;background:#FBFAF8}
.guide{counter-reset:g}
.guide li{list-style:none;position:relative;padding:7px 0 7px 34px;font-size:13.5px;color:var(--ink-2);border-bottom:1px dashed var(--line)}
.guide li:last-child{border:none}
.guide li::before{counter-increment:g;content:counter(g,decimal-leading-zero);position:absolute;left:0;top:8px;font-size:12px;font-weight:800;color:var(--red);font-style:italic}
.guide b{color:var(--ink)}
/* 用户切换 */
.preset-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.preset{border:1px solid var(--line-2);border-radius:10px;padding:9px 6px;text-align:center;transition:all .15s;background:var(--card)}
.preset:hover{border-color:var(--red);background:var(--red-paper)}
.preset .pv{width:30px;height:30px;border-radius:50%;background:var(--red-soft);color:var(--red-deep);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 5px}
.preset b{display:block;font-size:12px;line-height:1.3}
.preset i{font-style:normal;display:block;font-size:10px;color:var(--muted);line-height:1.4}
.usearch{position:relative;margin-bottom:10px}
.usearch .ipt{padding-left:34px}
.usearch .ic{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--muted)}
.ulist{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.urow{display:flex;align-items:center;gap:11px;width:100%;padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);transition:background .12s}
.urow:last-child{border-bottom:none}
.urow:hover{background:var(--red-paper)}
.urow .pv{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink-2);flex:none}
.urow b{font-size:13px}
.urow small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.urow .umeta{flex:1;min-width:0}
.urow .ucode{font-family:var(--mono);font-size:11px;color:var(--muted)}
.utag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;flex:none}
.utag.head{color:var(--red-deep);background:var(--red-soft)}
.utag.bp{color:#7A5510;background:var(--amber-soft)}
#toast-root{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;font-size:13px;border-radius:99px;padding:9px 20px;box-shadow:0 10px 30px -8px rgba(26,19,15,.5);animation:tin .3s ease}
.toast .ic{width:15px;height:15px;color:#7FD9A3}
.toast.warn .ic{color:#F2C063}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ============ Print ============ */
#printMount{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body.printing #app{display:none!important}
  body.printing #modal-root,body.printing #toast-root{display:none!important}
  body.printing #printMount{display:flex!important;justify-content:center}
  body.printing #printMount .scard{box-shadow:none;border:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 两栏（表单470+卡片460+侧栏228+边距）至少需约1250px，更窄时切单栏 */
@media (max-width:1250px){
  .card-layout{grid-template-columns:1fr}
  .preview-wrap{position:static}
}
@media (max-width:1120px){
  #app{grid-template-columns:64px 1fr}
  .side-logo b,.side-logo i,.nav-group>i,.nav-item span,.nav-item .bdg,.side-user>i,.cur-user div,.side-tools{display:none}
  .nav-item{justify-content:center;padding:11px 0}
  .cur-user{justify-content:center;padding:8px 0}
  .goal-grid,.wp-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="side-logo">
      <div class="mark" id="logo-mark"></div>
      <div><b>冲刺目标跟踪</b><i>SPRINT TRACKER</i></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-fill"></div>
    <div class="side-user">
      <i>当前用户</i>
      <div id="cur-user"></div>
      <button class="btn-switch" onclick="App.openUserSwitch()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H8"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h13"/></svg><span id="switch-label">切换用户</span></button>
    </div>
    <div class="side-tools">
      <button onclick="App.openPerm()">权限说明</button>
      <button onclick="App.openGuide()">原型说明</button>
      <button onclick="App.reset()">重置</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <section class="view" id="view-card"></section>
      <section class="view" id="view-board"></section>
      <section class="view" id="view-team"></section>
      <section class="view" id="view-edit"></section>
      <section class="view" id="view-bp"></section>
    </div>
  </main>
</div>
<div id="modal-root" onclick="if(event.target===this)App.closeModal()"></div>
<div id="toast-root"></div>
<div id="printMount"></div>

<script>

/* ---------- 用户体系推导 ---------- */
const USERS=ROSTER.map(r=>({code:r[0],name:r[1],dept:r[2],sub:r[3],mgr:r[4],seqRaw:r[5],seq:mapSeq(r[5]),hrbp:r[6]}));
const byCode={}; USERS.forEach(u=>byCode[u.code]=u);
const NAMES=new Set(USERS.map(u=>u.name));
const MGRS=new Set(USERS.map(u=>u.mgr).filter(n=>n&&NAMES.has(n)));   // 在册上级负责人
const BP_NAMES=new Set(USERS.map(u=>u.hrbp).filter(Boolean));          // HRBP：冯群/苏遇/肖霞
const subsOf=name=>USERS.filter(u=>u.mgr===name);
/* 部门（一级）与负责人推导：本部门内、上级不在本部门者中，直属下属最多者为负责人 */
const DEPT_MEMBERS={}; USERS.forEach(u=>{(DEPT_MEMBERS[u.dept]=DEPT_MEMBERS[u.dept]||[]).push(u)});
const DEPTS=Object.keys(DEPT_MEMBERS).sort((a,b)=>DEPT_MEMBERS[b].length-DEPT_MEMBERS[a].length);
const DEPT_HEAD={};
for(const d of DEPTS){
  const members=DEPT_MEMBERS[d], inDept=new Set(members.map(m=>m.name));
  const cands=members.filter(m=>!m.mgr||!inDept.has(m.mgr));
  let best=null,bc=-1;
  for(const c of cands){const n=subsOf(c.name).filter(s=>s.dept===d).length;if(n>bc){bc=n;best=c}}
  DEPT_HEAD[d]=best?best.name:null;
}

  ['card','board','team','edit','bp'].forEach(r=>{

const App={
  go(r){S.route=r;if(r==='board')S.editWeek=false;render()},
  switchUser(code){
    if(!byCode[code])return;
    S.uid=code;S.route='card';S.editWeek=false;S.editMember=null;
    S.selDept=byCode[code].dept;S.selWeek=Q.current;
    closeModal();render();
    toast(`已切换为 ${byCode[code].name}（${roleOf(byCode[code])}），权限已同步`);
  },
  /* ---- 用户切换 ---- */
  openUserSwitch(q){
    q=(q||'').trim();
    const presets=[
      {code:'0000033803',tip:'总经理办公会'},
      {code:'0000013263',tip:'实施中心负责人'},
      {code:'0000018635',tip:'实施中心中层·19人'},
      {code:'0000000955',tip:'央企事业部负责人'},
      {code:'0000054159',tip:'HRBP·196人'},
      {code:'0000014205',tip:'普通员工'},
    ];

      const res=USERS.filter(u=>u.name.includes(q)||u.code.includes(q)||u.dept.includes(q)||(u.sub||'').includes(q)).slice(0,30);

    }
    openModal(`<div class="modal" style="width:520px"><div class="modal-head"><h3>切换用户 · 花名册 ${USERS.length} 人</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
    <div class="modal-pad">
      <div class="preset-row">
        ${presets.map(p=>`<button class="preset" onclick="App.switchUser('${p.code}')"><span class="pv">${esc(byCode[p.code].name[0])}</span><b>${esc(byCode[p.code].name)}</b><i>${p.tip}</i></button>`).join('')}
      </div>
      <div class="usearch">${ic('search')}<input class="ipt" id="u-q" placeholder="搜索姓名 / 员工编码 / 部门" value="${esc(q)}" oninput="App.userSearchTimer()"></div>
      <div id="u-list">${q?listHtml:'<div class="hint" style="text-align:center;padding:10px">输入关键词搜索，或点击上方常用演示身份</div>'}</div>
    </div></div>`);
    setTimeout(()=>{const i=$('#u-q');if(i&&q){i.focus();i.setSelectionRange(q.length,q.length)}},50);
  },
  _ut:null,
  userSearchTimer(){clearTimeout(this._ut);this._ut=setTimeout(()=>{
    const q=$('#u-q').value.trim();
    const res=q?USERS.filter(u=>u.name.includes(q)||u.code.includes(q)||u.dept.includes(q)||(u.sub||'').includes(q)).slice(0,30):[];
    $('#u-list').innerHTML=res.length?`<div class="ulist">${res.map(u=>App.urowHTML(u)).join('')}</div>`:`<div class="hint" style="text-align:center;padding:14px">${q?'未找到匹配用户':'输入关键词搜索'}</div>`;
  },180)},
  urowHTML(u){
    const role=roleOf(u);
    const tag=role==='HRBP'?'<span class="utag bp">HRBP</span>':role==='负责人'?'<span class="utag head">负责人</span>':'';

      <span class="ucode">${esc(u.code)}</span>
    </button>`;
  },
  /* ---- 拆解填写 ---- */
  editMember(code){S.editMember=code;S.route='edit';render()},
  pickSeq(id){
    const code=S.editMember;if(!code||!PERM.canFill(code))return;
    let c=getCard(code);const cur2=effSeq(code);
    if(cur2!==id){
      if(!c){c={status:'blank',items:[]};DB.cards[code]=c}
      c.seq=id;c.items=seqOf(id).items.map(()=>({v:''}));
    }
    save();renderEditView();
  },
  onItemInput(i){
    const code=S.editMember;
    let c=getCard(code);
    if(!c){c={items:[]};DB.cards[code]=c}
    if(!c.seq)c.seq=byCode[code].seq;
    if(!c.items)c.items=[];
    const inp=document.querySelector(`.item-row input[data-i="${i}"]`);
    c.items[i]={v:inp.value.trim()};
    save();
    $('#card-preview').innerHTML=cardHTML(code,'me');
  },
  saveDraft(){
    const code=S.editMember;let c=getCard(code);

    c.status='draft';c.savedAt='刚刚';save();renderEditView();renderNav();toast('草稿已保存，可稍后下发');
  },
  issueCard(){
    const code=S.editMember;const m=byCode[code];const c=getCard(code);
    const items=cardItems(code);
    if(!items.some(i=>i.v)){toast('请至少填写一个目标值',1);return}
    openModal(`<div class="modal" style="max-width:440px"><div class="modal-pad">
      <h3 style="font-size:16px;margin-bottom:10px">下发目标卡给 ${esc(m.name)}？</h3>

      <div class="modal-actions" style="padding:16px 0 0;border:none">
        <button class="btn ghost sm" onclick="App.closeModal()">再想想</button>
        <button class="btn red sm" onclick="App.doIssue()">${ic('send')} 确认下发</button>
      </div></div></div>`);
  },
  doIssue(){
    const code=S.editMember;const m=byCode[code];
    let c=getCard(code);
    if(!c){c={items:[]};DB.cards[code]=c}
    if(!c.seq)c.seq=byCode[code].seq;
    if(!c.items)c.items=[];
    if(!c.seq)c.seq=byCode[code].seq;
    c.status='issued';c.issuedAt='刚刚';c.issuedBy=cur().name;
    save();closeModal();S.route='team';render();toast(`目标卡已下发 ${m.name}，锁定生效`);
  },
  retractAsk(code){
    const m=byCode[code];
    openModal(`<div class="modal" style="max-width:430px"><div class="modal-pad">
      <h3 style="font-size:16px;margin-bottom:10px">撤回 ${esc(m.name)} 的目标卡？</h3>

      <div class="modal-actions" style="padding:16px 0 0;border:none">
        <button class="btn ghost sm" onclick="App.closeModal()">取消</button>
        <button class="btn sm" onclick="App.doRetract('${code}')">确认撤回</button>
      </div></div></div>`);
  },
  doRetract(code){const c=getCard(code);if(c){c.status='draft';c.issuedAt='';}save();closeModal();render();toast('已撤回，可重新编辑')},
  openMember(code){
    openModal(`<div class="modal" style="width:560px"><div class="modal-head"><h3>目标卡 · ${esc(byCode[code].name)}（已下发）</h3>
      <button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
      <div class="modal-card-zone">${cardHTML(code,'mv'+code)}</div>
      <div class="modal-actions">
        <button class="btn ghost sm" onclick="App.exportPNG('mv${code}')">${ic('down')} 导出图片</button>
        <button class="btn danger sm" onclick="App.doRetract('${code}');App.closeModal()">撤回修改</button>
      </div></div>`);
  },
  openCmp(){
    openModal(`<div class="modal" style="max-width:640px"><div class="modal-head"><h3>各序列本季度核心目标项对照表</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
    <div class="modal-pad">
      <p class="hint" style="margin:0 0 12px">下列目标项为各序列统一口径，<b style="color:var(--ink)">同序列使用同一套目标项与计量单位</b>；销售序列两项必填。</p>
      <table class="cmp-table">
        <tr><th>序列</th><th>核心目标项</th></tr>
        ${SEQ.map(s=>`<tr><td>${s.name}</td><td>${s.items.map((it,i)=>`${i+1}　${esc(it.t)}（${esc(it.u)}）`).join('；<br>')}</td></tr>`).join('')}
      </table>
    </div></div>`);
  },
  /* ---- 导出 / 打印 ---- */
  exportPNG(uid){
    const el=document.getElementById('scard-'+uid);
    if(!el||el.classList.contains('empty-state')){toast('暂无可导出的目标卡',1);return}
    if(typeof html2canvas==='undefined'){toast('导出组件未加载（离线），已为你打开打印',1);App.printCard(uid);return}
    html2canvas(el,{scale:2,useCORS:true,backgroundColor:null}).then(cv=>{
      const a=document.createElement('a');
      const code=uid==='me'?S.uid:S.editMember;
      a.download=`达标冲刺目标卡-${byCode[code].name}-2026Q4.png`;a.href=cv.toDataURL('image/png');a.click();toast('目标卡图片已导出');
    }).catch(()=>{toast('导出失败，已为你打开打印',1);App.printCard(uid)});
  },
  printCard(uid){
    const el=document.getElementById('scard-'+uid);if(!el||el.classList.contains('empty-state')){toast('暂无可打印的目标卡',1);return}
    const m=$('#printMount');m.innerHTML='';m.appendChild(el.cloneNode(true));
    document.body.classList.add('printing');
    const done=()=>{document.body.classList.remove('printing');m.innerHTML='';window.removeEventListener('afterprint',done)};
    window.addEventListener('afterprint',done);
    setTimeout(()=>window.print(),60);
  },
  /* ---- 看板 ---- */
  pickDept(d){if(!PERM.visibleDepts().includes(d)){toast('员工仅可查看本部门看板',1);return}S.selDept=d;S.editWeek=false;render()},
  pickWeek(n){S.selWeek=n;S.editWeek=false;render()},
  startWeekEdit(){S.editWeek=true;render()},
  cancelWeekEdit(){S.editWeek=false;render()},
  saveWeek(){
    const d=S.selDept;let b=boardOf(d);if(!b){b={goals:[],path:[],weeks:{},hasBoard:true};DB.boards[d]=b}
    const pcts=b.goals.map((_,gi)=>Math.max(0,Math.min(100,+($('#nrg-'+gi)?.value||latestPct(b,S.selWeek,gi)))));
    const note=$('#wk-note').value.trim();
    if(!note){toast('请填写本周进展说明',1);return}
    if(!b.weeks)b.weeks={};
    b.weeks[S.selWeek]={pct:pcts,note,at:'刚刚'};
    b.lastAt='刚刚';S.editWeek=false;save();render();toast(`${fmtW(S.selWeek)} 进度已更新，全员可见`);
  },
  editDept(){
    const d=S.selDept;const b=boardOf(d)||{};
    openModal(`<div class="modal" style="max-width:520px"><div class="modal-head"><h3>部门目标设置 · ${esc(d)}</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
    <div class="modal-pad">
      <div class="row2">
        <div class="field"><label>部门</label><input class="ipt" value="${esc(d)}" disabled></div>
        <div class="field"><label>负责人</label><input class="ipt" value="${esc(DEPT_HEAD[d]||'')}" disabled></div>
      </div>
      <div class="field"><label>目标 1 <em>*</em></label><input class="ipt" id="ed-g1" value="${esc((b.goals||[])[0]||'')}" placeholder="例：3 个重点项目按期交付，按期率 100%"></div>
      <div class="field"><label>目标 2 <em>*</em></label><input class="ipt" id="ed-g2" value="${esc((b.goals||[])[1]||'')}" placeholder="例：季度验收回款 ¥500 万"></div>
      <div class="field"><label>实施路径（每行一条）</label><textarea class="ipt" id="ed-path" rows="3">${esc((b.path||[]).join('\n'))}</textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost sm" onclick="App.closeModal()">取消</button>
      <button class="btn red sm" onclick="App.saveDept()">${ic('shield')} 保存并生成看板</button>
    </div></div>`);
  },
  saveDept(){
    const d=S.selDept;
    const g1=$('#ed-g1').value.trim(),g2=$('#ed-g2').value.trim();
    if(!g1||!g2){toast('目标 1 与目标 2 均为必填',1);return}
    const b=boardOf(d)||{weeks:{}};
    b.goals=[g1,g2];
    b.path=$('#ed-path').value.split('\n').map(s=>s.trim()).filter(Boolean);
    b.hasBoard=true;if(!b.weeks)b.weeks={};
    DB.boards[d]=b;save();closeModal();render();toast('部门目标已保存，看板已生成');
  },
  viewDeptBoard(d){S.selDept=d;S.selWeek=Q.current;S.route='board';S.editWeek=false;render()},
  remind(head){toast(`已向 ${head} 发送填写 / 更新提醒（演示）`)},
  /* ---- 说明 ---- */
  openPerm(){
    openModal(`<div class="modal" style="max-width:620px"><div class="modal-head"><h3>权限说明（无审核版）</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
    <div class="modal-pad">
      <table class="matrix">
        <tr><th style="text-align:left">功能</th><th>员工</th><th>上级负责人</th><th>HRBP</th></tr>
        <tr><td>查看本人目标卡</td><td class="p">下发后只读 · 可导出</td><td class="y">✓</td><td class="y">✓</td></tr>
        <tr><td>拆解填写 · 下发下属目标卡</td><td class="n">—</td><td class="y">✓ 直属下属</td><td class="n">—</td></tr>
        <tr><td>查看部门进度看板</td><td class="p">仅本部门 · 只读</td><td class="y">✓ 全部 · 本部门可编辑</td><td class="y">✓ 全部 · 只读</td></tr>
        <tr><td>填写部门目标 / 每周更新进度</td><td class="n">—</td><td class="p">仅部门负责人</td><td class="n">—</td></tr>
        <tr><td>范围内统计与提醒</td><td class="n">—</td><td class="n">—</td><td class="y">✓</td></tr>
        <tr><td>目标卡导出（PNG / 打印）</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td></tr>
      </table>
      <p class="hint" style="margin-top:12px">规则：一人一卡，由上级负责人（花名册「上级主管」）拆解填写后直接下发到人，<b>无需员工回签、无需审核</b>；下发后锁定，撤回后可重新编辑。部门看板负责人由花名册汇报关系自动推导（部门内层级最高者）。</p>
    </div></div>`);
  },
  openGuide(){
    openModal(`<div class="modal" style="max-width:540px"><div class="modal-head"><h3>原型演示指引</h3><button class="x" onclick="App.closeModal()">${ic('x')}</button></div>
    <div class="modal-pad"><ol class="guide">
      <li><b>左下角「切换用户」</b>：花名册 ${USERS.length} 人全员可切换；顶部有 5 个常用演示身份（总经理 / 部门负责人 / HRBP / 普通员工），也可按姓名、编码、部门搜索。</li>
      <li><b>上级负责人</b>：「团队目标卡」列出直属下属 → 点「拆解填写」→ 序列已按花名册职位序列预选 → 填目标值 →「下发到人」。下发即锁定，<b>无需审核、无需员工回签</b>。</li>
      <li><b>员工</b>：「我的冲刺卡」只读查看上级下发的目标卡（下发前不可见），下发后可导出 PNG / 打印。</li>
      <li><b>部门负责人</b>：「部门进度看板」设置部门目标（目标1/目标2/路径）并<b>每周更新进度</b>；员工只读且仅见本部门。</li>
      <li><b>HRBP（冯群 / 苏遇 / 肖霞）</b>：「BP 总览」查看覆盖范围内目标卡下发率、看板更新情况并发送提醒。</li>
      <li>数据改动自动保存在浏览器；侧边栏「重置」可还原初始状态（含演示种子数据）。</li>
    </ol></div></div>`);
  },
  reset(){localStorage.removeItem(LSKEY);location.href=location.pathname+'#/card';location.reload()},
  closeModal,
};

/* ============ 启动 ============ */
$('#logo-mark').innerHTML=ic('flag');
$('#switch-label').textContent='切换用户';
(function(){
  const h=location.hash.replace('#/','');
  if(['card','board','team','bp'].includes(h))S.route=h;
  const qs=new URLSearchParams(location.search);
  const q=qs.get('u');
  if(q&&byCode[q])S.uid=q;
  if(!PERM.isHead())S.selDept=cur().dept;else S.selDept=cur().dept;
  const m=qs.get('m');
  if(m&&byCode[m]&&PERM.isHead()){S.editMember=m;S.route='edit'}
  render();
  setTimeout(()=>toast(`已加载花名册 ${USERS.length} 名用户 · 当前身份：${cur().name}（${roleOf(cur())}）`),600);
})();
</script>
</body>
</html>
